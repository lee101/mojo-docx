[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-docx"
version = "0.1.0"
description = "A standalone python-docx-compatible subset with Mojo OOXML kernels"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
